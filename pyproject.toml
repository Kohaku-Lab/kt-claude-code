[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kt-claude-code"
version = "0.3.0"
description = "KohakuTerrarium LLM backend driving your local, signed-in Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "kohakuterrarium>=2.2.0",
    "claude-agent-sdk>=0.2.168,<0.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "claude-agent-sdk>=0.2.168,<0.3", "ruff", "black"]

[tool.hatch.build.targets.wheel]
packages = ["kt_claude_code"]

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: runs the real Claude Code CLI (set KT_CLAUDE_LIVE=1)"]
