name: kt-claude-code
version: 0.2.0
description: >-
  KohakuTerrarium LLM backend that runs model steps through your local,
  already signed-in Claude Code (Claude Agent SDK). Personal use; it provides
  no login of its own.
python_dependencies:
  - claude-agent-sdk>=0.2.168,<0.3

llm_backends:
  - name: claude-code
    module: kt_claude_code.provider
    class: ClaudeCodeProvider
    display_name: Claude Code (local sign-in)
    description: Uses the Claude Code CLI you signed in to yourself.
    credentials: external

llm_presets:
- name: claude-code-opus
  provider: claude-code
  model: opus
  max_context: 1000000
  reasoning_effort: high
  variation_groups:
    reasoning:
      low:
        reasoning_effort: low
      medium:
        reasoning_effort: medium
      high:
        reasoning_effort: high
      xhigh:
        reasoning_effort: xhigh
      max:
        reasoning_effort: max
    context:
      200k:
        max_context: 200000
      400k:
        max_context: 400000
      700k:
        max_context: 700000
      1m:
        max_context: 1000000
- name: claude-code-fable
  provider: claude-code
  model: fable
  max_context: 1000000
  reasoning_effort: high
  variation_groups:
